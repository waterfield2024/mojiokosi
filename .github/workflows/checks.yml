name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    env:
      # Match bootstrap.cmd: Japanese setup messages use UTF-8 on every locale.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2 numpy==2.5.4
      - run: python -m unittest discover -s tests -v
