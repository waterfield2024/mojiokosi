name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    env:
      # Match bootstrap.cmd: Japanese setup messages use UTF-8 on every locale.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2 numpy==2.5.4
      - run: python -m unittest discover -s tests -v
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Install native prerequisites
        run: brew install python@3.12 python-tk@3.12 ffmpeg-full ollama
      - name: Set up isolated Apple Silicon environment
        run: /opt/homebrew/opt/python@3.12/bin/python3.12 setup_mac.py --model base --device cpu --without-context-ai
      - name: Mac adapter tests
        run: .venv-macos/bin/python -m unittest discover -s tests -p test_macos.py -v
      - name: Overlapping speech contracts
        run: .venv-macos/bin/python -m unittest discover -s tests -p test_overlap.py -v
      - name: Native GUI and Whisper inference
        run: .venv-macos/bin/python tests/mac_smoke.py
